access_control:
  default_role: presenter
  # An empty DEMO_ADMIN_TOKEN means anyone who can reach the app can drive the
  # controls. Acceptable on a laptop, never acceptable on a hosted URL.
  admin_token_set: false
  authenticating_proxy_in_front: false

verification:
  # Commands that must pass before a demo is considered ready.
  offline:
    - python -m fintech_demo preflight
    - python -m pytest simulator/tests -q
    - python scripts/build_fixtures.py --check
    - npm --prefix app run lint
    - npm --prefix app run typecheck
    - npm --prefix app run build
    - npm --prefix app run scan:bundle
  against_workspace:
    - python -m fintech_demo doctor
    - python -m fintech_demo bootstrap
    - python -m fintech_demo verify --scenario A1_REVIEW_SPIKE --inject
    - python -m fintech_demo verify --scenario A2_PROCESSOR_TIMEOUT --inject
    - python -m fintech_demo verify --scenario A3_LOSS_CLUSTER --inject
    - python -m fintech_demo verify --scenario A4_CORRESPONDENT_SPIKE --inject
    - python -m fintech_demo verify --scenario A5_CASE_SURGE --inject
    - python -m fintech_demo verify --scenario A6_SETTLEMENT_DELAY --inject
    - python -m fintech_demo verify --scenario A7_PENDING_EXPOSURE --inject
    - python -m fintech_demo verify --scenario A8_DINING_SPIKE --inject
  in_app:
    - GET /api/health/demo returns status demo_ready
    - /admin/domain-check run all, every question marked correct
