    domain_key_configured: false
    known_questions_passed_at: null
    fixture_count: 12
    scenario: A3_LOSS_CLUSTER

  - id: a4
    name: Financial Crime Operations
    status: available
    domain_name: a4_aml_operations
    manifest: domains/a4-aml-operations/manifest.yaml
    context_version: 1.0.0
    domain_built: false
    domain_key_configured: false
    known_questions_passed_at: null
    fixture_count: 12
    scenario: A4_CORRESPONDENT_SPIKE

  - id: a5
    name: Dispute Operations Performance
    status: available
    domain_name: a5_disputes_ops
    manifest: domains/a5-disputes-operations/manifest.yaml
    context_version: 1.0.0
    domain_built: false
    domain_key_configured: false
    known_questions_passed_at: null
    fixture_count: 12
    scenario: A5_CASE_SURGE

  - id: a6
    name: Liquidity and Funding Management
    status: available
    domain_name: a6_liquidity
    manifest: domains/a6-liquidity/manifest.yaml
    context_version: 1.0.0
    domain_built: false
