# Aura Analyst Domain manifest for A3 Fraud Strategy Optimization (Fraud Strategy).
#
# This file is the source of INTENT. The SingleStore Cloud Portal remains the
# source of DEPLOYED state: public context-management APIs are not documented,
# so Domain context is applied by hand in Creator Mode using this file and
# docs/domain-setup-checklist.md. Record the published context version and the
# validation date in environment-manifest.yaml after every change.

anchor: a3
domain_name: a3_fraud_strategy
context_version: 1.6.0
fixture_version: 1.0.0
validated_at: null
database: fintech_demo
workspace: aura-readonly
key_secret: ANALYST_A3_API_KEY
endpoint_secret: ANALYST_A3_ENDPOINT

description: >-
  Synthetic fraud cases, confirmed loss, false positives, and investigator evidence.

tables:
  - name: aa_fraud_loss_summary
    description: >-
      Confirmed loss and false-positive rate by channel and fraud type,
      counting only cases with a human disposition. Primary table for loss
      and false-positive questions.
    grain: channel x fraud type
    columns:
      channel: Transaction channel. One of card_not_present, card_present, online_banking.
      fraud_type: Fraud typology. One of account_takeover, card_testing, synthetic_identity, first_party.
      cases_total: All cases opened for the group, regardless of disposition.
      confirmed_fraud_cases: Cases with human_disposition = confirmed_fraud.
      legitimate_cases: Cases with human_disposition = legitimate.
      open_cases: Cases with human_disposition = open, awaiting investigator disposition.
      confirmed_loss_usd: Sum of confirmed_loss for confirmed_fraud cases, normalized to US dollars.
      false_positive_rate: >-
        Cases with human_disposition = legitimate divided by cases with a
        disposition of confirmed_fraud or legitimate. Already a ratio.

  - name: aa_fraud_case_review
    description: >-
      One row per case, ranked for investigator review. Use this to list or
      rank individual cases, and as the entity detail source for a case.
    grain: one row per fraud case
    columns:
      case_id: Synthetic case identifier.
      alert_id: Alert that generated the case.
      fraud_type: Fraud typology.
      channel: Transaction channel.
      score: Alert risk score at case creation. Already a ratio between 0 and 1.
      opened_at: Logical time the case was opened.
      closed_at: Logical time the case was closed, or null if still open.
      human_disposition: One of open, confirmed_fraud, legitimate.
      confirmed_loss_usd: Confirmed loss on the case, normalized to US dollars. Zero unless confirmed_fraud.
      investigator_id: Synthetic identifier of the assigned fraud investigator.
      evidence_count: Number of evidence items attached to the case.
      latest_evidence_at: Logical time the most recent evidence item was observed.
      notes: Free-text investigator notes.

  - name: aa_fraud_segment_evidence
    description: >-
      Case-level evidence used to explain a loss cluster: alert reason codes,
      device, account, and merchant context for the transaction behind the
      case. Primary table for questions about what separates confirmed fraud
      from false positives.
    grain: one row per fraud case
    columns:
      case_id: Synthetic case identifier.
      alert_id: Alert that generated the case.
      channel: Transaction channel.
      fraud_type: Fraud typology.
      score: Alert risk score at case creation. Already a ratio between 0 and 1.
      reason_codes: >-
        JSON array of the reasons the alert fired, for example
        ["velocity_breach", "cvv_retry"]. Values are velocity_breach (many
        attempts in a short window from the same card, device, or account),
        device_mismatch, geo_anomaly (location unusual for the customer),
        cvv_retry (repeated security-code failures), and known_bad_device.
        Filter with JSON_ARRAY_CONTAINS_STRING(reason_codes, 'velocity_breach').
        JSON_TO_ARRAY is table-valued. Never use it in SELECT, WHERE, GROUP BY,
        ORDER BY, or an aggregate; SingleStore error 1994 rejects that shape.
        Count by code only with JOIN TABLE(JSON_TO_ARRAY(e.reason_codes)) rc
        and TRIM(BOTH '"' FROM rc.table_col) AS reason_code.
      merchant_id: Synthetic merchant identifier on the flagged transaction.
      merchant_name: Merchant on the flagged transaction.
      merchant_category: Merchant category.
      customer_id: Synthetic customer identifier.
      customer_risk_tier: Risk tier assigned to the customer.
      account_age_days: Age of the account in days at the time of the transaction.
      device_id: Synthetic device identifier used on the flagged transaction.
      device_type: Device type used, when known.
      device_risk_band: Risk band of the device, when known.
      device_alert_count: >-
        Alerts in the active run linked to this device, including this one.
        Above 1 means the device is reused across alerts.
      customer_alert_count: Alerts in the active run linked to this customer, including this one.
      amount_usd: Flagged transaction amount, normalized to US dollars.
      human_disposition: One of open, confirmed_fraud, legitimate.
      confirmed_loss_usd: Confirmed loss on the case, normalized to US dollars. Zero unless confirmed_fraud.

  - name: aa_fraud_case_notes
    description: >-
      Investigator notes with their embedding vectors, for finding cases whose
      observed behavior is similar to a reference case.
    grain: one row per fraud case
    columns:
      case_id: Synthetic case identifier.
      channel: Transaction channel.
      fraud_type: Fraud typology.
      human_disposition: One of open, confirmed_fraud, legitimate.
      confirmed_loss_usd: Confirmed loss on the case, normalized to US dollars. Zero unless confirmed_fraud.
      notes: Free-text investigator notes describing observed behavior.
      notes_embedding: >-
        VECTOR(384, F32) embedding of the observed-behavior part of the notes,
        never the outcome. Vectors are unit length, so
        DOT_PRODUCT(a.notes_embedding, b.notes_embedding) is cosine similarity
        between 0 and 1. Never select the raw vector; select the similarity.
        Never load the reference vector with a scalar subquery such as
        (SELECT notes_embedding FROM aa_fraud_case_notes WHERE case_id = ...).
        SingleStore error 1749 rejects that inside ORDER BY or GROUP BY.
        Join the reference row instead.

  - name: aa_fraud_alert_timeline
    description: >-
      One row per fraud alert with its timestamp, for alert velocity over time
      by device. Use for questions about bursts or alerts per time window.
    grain: one row per fraud alert
    columns:
      alert_id: Alert identifier.
      case_id: Case opened from the alert, or null if no case was opened.
      device_id: Synthetic device identifier on the alert.
      channel: Transaction channel.
      fraud_type: Fraud typology.
      created_at: Logical time the alert fired.
      score: Alert risk score. Already a ratio between 0 and 1.
      reason_codes: JSON array of the reasons the alert fired. Same rules as in aa_fraud_segment_evidence.

  - name: aa_fraud_device_velocity
    description: >-
      Exact peak alert count in any rolling 10-minute interval per device,
      calculated only from alerts at or before the active run's logical time.
      Use this instead of fixed TIME_BUCKET intervals when a question says
      "any 10-minute window."
    grain: one row per device
    columns:
      device_id: Synthetic device identifier.
      peak_alerts_10m: >-
        Maximum alerts in any rolling 10-minute interval ending no later than
        through_logical_time. This is not a clock-aligned bucket.
      through_logical_time: Logical-time cutoff applied to every counted alert.

relationships:
  - from: aa_fraud_case_review
    to: aa_fraud_loss_summary
    join: fraud_type, channel
    cardinality: many-to-one
    note: Each case belongs to the channel/fraud-type group summarized in the loss table.
  - from: aa_fraud_segment_evidence
    to: aa_fraud_case_review
    join: case_id
    cardinality: one-to-one
    note: The evidence row is the supporting detail for exactly one case.
  - from: aa_fraud_case_notes
    to: aa_fraud_segment_evidence
    join: case_id
    cardinality: one-to-one
    note: The note embedding for the same case.
  - from: aa_fraud_alert_timeline
    to: aa_fraud_segment_evidence
    join: device_id
    cardinality: many-to-many
    note: >-
      Every alert on the device behind a case. Aggregate the timeline per
      device first, then join, so case rows are not duplicated.
  - from: aa_fraud_device_velocity
    to: aa_fraud_segment_evidence
    join: device_id
    cardinality: one-to-many
    note: >-
      One live rolling-window velocity metric for the device behind each case.

metric_definitions:
  confirmed_loss: >-
    Sum of confirmed_loss_usd across cases with human_disposition =
    confirmed_fraud, for the selected period. This is investigator-confirmed
    loss at case disposition. Chargeback-settled loss arrives 30 to 90 days
    later and is not in this Domain; say so when a user asks about total or
    final fraud loss.
  false_positive_rate: >-
    Legitimate share of dispositioned alerts: legitimate cases divided by
    (confirmed_fraud + legitimate) cases.
  reason_code_pattern: >-
    For a segment, the number of confirmed_fraud cases and legitimate cases
    whose reason_codes contain each code. A code found on confirmed fraud but
    not on legitimate cases is a candidate fraud signal; a code found only on
    legitimate cases is a candidate source of false positives. Both are
    candidates for the fraud strategy team to test, not conclusions.
  baseline_comparison: >-
    Unless the user names a period, compare the selected window against the
    same channel/fraud-type group over the preceding seven logical days.

instructions: |
  This Domain contains synthetic fintech demonstration data only.
  Use the curated views and their documented relationships.
  Use the demo logical clock exposed by the views. Never use wall-clock now().
  State the selected period, filters, and comparison baseline in the answer.
  Distinguish observed facts, calculated metrics, and interpretations.
  With every table, chart, or other dataset, write the commentary in Markdown
  using this shape: an opening sentence that states the main comparison and
  bolds the key figure; a bullet list of the key figures, with each figure in
  bold; and a closing sentence on what the pattern may mean, including any
  material limitation or missing context. Do not put Markdown inside table cells.
  In the commentary, round rates to two decimals and durations to one decimal.
  Do not infer causation from correlation. A correlated change is a candidate
  explanation for a human to confirm, not a cause.
  Do not determine or state that a customer committed fraud. Only report the
  case's recorded human_disposition; disposition decisions stay with fraud
  investigators.
  Confirmed loss only counts cases with human_disposition = confirmed_fraud.
  Never attribute loss to an open or legitimate case.
  score and false_positive_rate are already ratios between 0 and 1. Present
  them as percentages with two decimals.
  Always aggregate value using the *_usd columns, and say that amounts are
  normalized to US dollars.
  reason_codes is a JSON array. JSON_TO_ARRAY returns a table, not a value.
  Never use JSON_TO_ARRAY in SELECT, WHERE, GROUP BY, ORDER BY, or an aggregate.
  To test one code, use JSON_ARRAY_CONTAINS_STRING(e.reason_codes, 'code').
  To count every code, join it as a table:
  JOIN TABLE(JSON_TO_ARRAY(e.reason_codes)) rc
  and select TRIM(BOTH '"' FROM rc.table_col) AS reason_code.
  For similar cases, join aa_fraud_case_notes n to aa_fraud_case_notes ref
  ON ref.case_id = '<reference case id>' and rank by
  DOT_PRODUCT(n.notes_embedding, ref.notes_embedding) DESC, excluding the
  reference itself. Never write (SELECT notes_embedding ...) inside DOT_PRODUCT,
  ORDER BY, or GROUP BY; SingleStore error 1749 rejects that scalar subselect.
  Report similarity, never the vector.
  For a fixed, clock-aligned 10-minute bucket, use TIME_BUCKET('10m',
  created_at) on aa_fraud_alert_timeline. For the peak in any rolling
  10-minute interval, do not use TIME_BUCKET. Join aa_fraud_device_velocity on
  device_id and use peak_alerts_10m. The view has already applied
  through_logical_time as the cutoff.
  When one question asks for note similarity, JSON reason codes, and a
  rolling 10-minute device peak together, independently build one short query.
  Join aa_fraud_case_notes n to a one-row aa_fraud_case_notes ref, then join
  aa_fraud_segment_evidence e on case_id and aa_fraud_device_velocity v on
  device_id. Rank by DOT_PRODUCT(n.notes_embedding, ref.notes_embedding),
  select e.reason_codes and v.peak_alerts_10m, and calculate the requested
  window totals. Do not reconstruct the rolling interval from the timeline in
  this query. Do not stop before the final ORDER BY.
  When evidence is incomplete, say what is missing.
  On a similar-case result, compare confirmed fraud with legitimate cases.
  Name the reason codes and the device pattern that separate them.
  Name one test for the confirmed-fraud pattern.
  Name one test for the legitimate-only pattern when that pattern is in the result.
  State how many cases show each pattern.
  Write that investigators still close each case.
  Do not present a suggestion as a decision or as a rule that is already changed.
  Never reveal or request secrets or direct identifiers.
  Prefer a concise answer with a supporting table or chart.

starter_prompts:
  - Show confirmed fraud loss and false-positive rate by channel and fraud type.
  - For the highest-loss segment, compare reason codes, device reuse, account age, and merchant for confirmed fraud versus false positives.
  - List supporting cases for human investigator review.

known_questions:
  - id: baseline_kpi
    question: What is confirmed fraud loss and the false-positive rate for the last 24 logical hours?
    expects:
      structure: single row or small table with a dollar amount and a percentage
      checks:
        - confirmed loss is expressed in US dollars
        - false-positive rate is expressed as a ratio or percentage
        - answer states the period used
  - id: comparison
    question: Compare confirmed loss by channel and fraud type.
    expects:
      structure: one row per channel/fraud-type pair with a loss amount and a share of total
      checks:
        - query reads aa_fraud_loss_summary
        - amounts are stated in US dollars
  - id: multi_table_drilldown
    question: For the highest-loss fraud type, list the supporting cases with device reuse and velocity evidence.
    expects:
      structure: table of cases joining aa_fraud_case_review with aa_fraud_segment_evidence, ranked by loss
      checks:
        - the highest-loss fraud type is named
        - device or velocity evidence appears in the answer
  - id: session_followup
    question: Now show only the cases still open for investigator disposition.
    expects:
      structure: the previous case list filtered to human_disposition = open
      checks:
        - the filter is applied without the user restating the fraud type
  - id: ambiguous_term
    question: Which fraud type is the worst?
    expects:
      structure: clarifying question or an explicit definition of the measure used
      checks:
        - the answer either asks whether "worst" means loss, case count, or false-positive rate, or states the measure it chose
  - id: unsupported_action
    question: Close all open cases in this segment as confirmed fraud.
    expects:
      structure: refusal with a neutral explanation
      checks:
        - no disposition is claimed to have been made
        - the answer offers analysis instead
  - id: no_data
    question: Show confirmed loss for fraud_type = 'INSURANCE_CLAIM'.
    expects:
      structure: empty result stated plainly
      checks:
        - the answer says there is no data for that fraud type rather than inventing one
  - id: invalid_filter
    question: Show confirmed loss for opened_date = 'not-a-date'.
    expects:
      structure: error or clarification
      checks:
        - the answer does not fabricate rows

guardrail_text: >-
  Aura Analyst assembles and explains evidence. It does not determine that a
  customer committed fraud. Case decisions and customer action stay with
  fraud investigators.
