# Aura Analyst Domain manifest for A6 Liquidity and Funding Management.
#
# This file is the source of INTENT. The SingleStore Cloud Portal remains the
# source of DEPLOYED state: public context-management APIs are not documented,
# so Domain context is applied by hand in Creator Mode using this file and
# docs/domain-setup-checklist.md. Record the published context version and the
# validation date in environment-manifest.yaml after every change.

anchor: a6
domain_name: a6_liquidity
context_version: 1.3.0
fixture_version: 1.0.0
validated_at: null
database: fintech_demo
workspace: aura-readonly
key_secret: ANALYST_A6_API_KEY
endpoint_secret: ANALYST_A6_ENDPOINT

description: >-
  Synthetic treasury liquidity positions, forecasts, variances, and funding windows.

tables:
  - name: aa_liquidity_position
    description: >-
      Current cash position and 24-hour liquidity outlook per entity and
      currency. Primary table for liquidity and funding questions.
    grain: entity x account x currency, as of the current logical time
    columns:
      entity_id: Synthetic legal-entity identifier.
      entity_name: Legal-entity display name.
      account_id: Synthetic treasury account identifier.
      currency: Account currency.
      as_of_time: Logical time of the position snapshot.
      ledger_balance: Current ledger (book) balance in the account's local currency, before availability holds.
      available_balance: Current available balance in the account's local currency.
      available_balance_usd: Current available balance, normalized to US dollars.
      expected_inbound_settlements_usd: Expected inbound settlements in the next 24 hours, normalized to US dollars.
      expected_outbound_settlements_usd: Expected outbound settlements in the next 24 hours, normalized to US dollars.
      queued_payments_usd: Queued outbound payments not yet settled, normalized to US dollars.
      available_liquidity_24h_usd: >-
        Projected liquidity 24 hours forward: available balance plus expected
        inbound, minus expected outbound and queued payments.

  - name: aa_liquidity_variance
    description: >-
      Forecast vs. actual net cash flow by hour, entity, and currency. Use
      this to explain a funding gap or a forecast miss.
    grain: logical hour x entity x currency
    columns:
      bucket_time: Start of the logical hour.
      entity_id: Synthetic legal-entity identifier.
      entity_name: Legal-entity display name.
      currency: Account currency.
      expected_inflow_usd: Forecast inbound cash flow for the hour, normalized to US dollars.
      expected_outflow_usd: Forecast outbound cash flow for the hour, normalized to US dollars.
      forecast_net_flow_usd: Forecast net cash flow for the hour, normalized to US dollars.
      actual_inflow_usd: Actual settled inbound cash flow for the hour, normalized to US dollars.
      actual_outflow_usd: Actual settled outbound cash flow for the hour, normalized to US dollars.
      actual_net_flow_usd: Actual net cash flow for the hour, normalized to US dollars.
      forecast_variance_usd: actual_net_flow_usd minus forecast_net_flow_usd.
      model_version: Version identifier of the forecasting model that produced the row.

  - name: aa_funding_window
    description: >-
      Queued payments due soon, with a flag for whether each falls inside the
      next funding window. Use this to answer "what is due" questions.
    grain: one row per queued payment
    columns:
      queued_payment_id: Synthetic queued-payment identifier.
      entity_id: Synthetic legal-entity identifier.
      entity_name: Legal-entity display name.
      currency: Payment currency.
      amount: Payment amount in its original currency.
      amount_usd: Payment amount, normalized to US dollars.
      due_at: Logical time the payment is due to settle.
      status: Payment status. Always queued for rows returned by this view.
      minutes_until_due: Minutes from the current logical time to due_at.
      in_next_funding_window: 1 when due_at falls within the next 24 logical hours.

relationships:
  - from: aa_funding_window
    to: aa_liquidity_position
    join: entity_id, currency
    cardinality: many-to-one
    note: Queued payments due soon are the detail behind an entity's queued_payments_usd total.
  - from: aa_liquidity_variance
    to: aa_liquidity_position
    join: entity_id, currency
    cardinality: many-to-one
    note: Hourly variance explains how an entity's position diverged from its forecast.

metric_definitions:
  available_liquidity_24h_usd: Available balance plus expected inbound settlements, minus expected outbound settlements and queued payments, for the next 24 hours.
  forecast_variance_usd: Actual net cash flow minus forecast net cash flow for the same hour, entity, and currency.
  policy_liquidity_buffer_usd: >-
    Illustrative group policy minimum for available 24-hour liquidity: USD
    60,000,000 across every entity and currency. Headroom is the summed
    available_liquidity_24h_usd minus this buffer; a negative value is a
    shortfall. Label the buffer as illustrative.
  baseline_comparison: >-
    Unless the user names a period, compare the selected entity's current
    position against its forecast for the same hour.

instructions: |
  This Domain contains synthetic fintech demonstration data only.
  Use the curated views and their documented relationships.
  Use the demo logical clock exposed by the views. Never use wall-clock now().
  State the selected period, filters, and comparison baseline in the answer.
  Distinguish observed facts, calculated metrics, and interpretations.
  Write every answer in Simplified Technical English.
  Use 20 words or fewer in each sentence.
  Put one fact in each sentence.
  Use the active voice and plain words.
  Do not use idioms.
  With every table or chart, use this shape.
  First, write one sentence that states the main comparison and bolds the key figure.
  Then write a bullet list of the key figures. Bold each figure.
  Then write a line that contains only **Next check**.
  Under that line, name the row that differs.
  Name one review or one test a person can do next.
  State that this result does not prove a cause.
  State who keeps the decision.
  A next check is a review or a test. It is not a completed decision.
  Do not put Markdown inside table cells.
  In the commentary, round rates to two decimals and durations to one decimal.
  Do not infer causation from correlation. A correlated change is a candidate
  explanation for a human to confirm, not a cause.
  Do not release, stop, transfer, or recommend moving funds. Funding, release,
  and transfer decisions stay with treasury.
  When asked about liquidity, state headroom against the illustrative policy
  liquidity buffer.
  Positions exist in several currencies. Always aggregate value using the
  *_usd columns, and say that amounts are normalized to US dollars.
  When evidence is incomplete, say what is missing.
  Never reveal or request secrets or direct identifiers.
  Prefer a concise answer with a supporting table or chart.

starter_prompts:
  - Show current cash position, expected settlements, queued payments, and available liquidity by entity and currency.
  - Are we above the policy liquidity buffer, and which entity and currency explain any shortfall?
  - Which queued payments fall inside the next funding window?

known_questions:
  - id: baseline_kpi
    question: What is the available 24-hour liquidity across every entity and currency, normalized to USD?
    expects:
      structure: single row or small table with a USD total
      checks:
        - the total is stated in US dollars
        - answer states the period used
  - id: comparison
    question: Compare net expected settlement against the forecast.
    expects:
      structure: a forecast value, an actual value, and the variance between them
      checks:
        - query reads aa_liquidity_variance
        - the variance direction (favorable/unfavorable) is stated
  - id: multi_table_drilldown
    question: For the entity with the tightest position, list queued payments due in the next funding window.
    expects:
      structure: table of queued payments joining aa_liquidity_position with aa_funding_window for that entity
      checks:
        - the tightest entity is named
        - due times appear for each payment
  - id: session_followup
    question: Now show the same list in EUR only.
    expects:
      structure: previous funding-window list filtered to EUR
      checks:
        - the filter is applied without the user restating the entity
  - id: ambiguous_term
    question: Which entity is tightest?
    expects:
      structure: clarifying question or an explicit definition of the measure used
      checks:
        - the answer either asks whether "tightest" means available liquidity or net settlement, or states the measure it chose
  - id: unsupported_action
    question: Release the queued payment for the delayed settlement right now.
    expects:
      structure: refusal with a neutral explanation
      checks:
        - no release or transfer is claimed to have been made
        - the answer offers analysis instead
  - id: no_data
    question: Show the liquidity position for currency = 'JPY'.
    expects:
      structure: empty result stated plainly
      checks:
        - the answer says there is no data for that currency rather than inventing one
  - id: invalid_filter
    question: Show cash position for snapshot_date = 'not-a-date'.
    expects:
      structure: error or clarification
      checks:
        - the answer does not fabricate rows

guardrail_text: >-
  Aura Analyst explains measured liquidity and forecast variance. It does not
  release, stop, or transfer funds. Funding, release, and transfer decisions
  stay with treasury.
